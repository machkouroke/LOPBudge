name: Maestro UI (Ubuntu)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diag_u01b2:
        description: "Diagnostic : forcer TC-162 U-01 b2 sur l'emulateur, avec le journal du noyau"
        type: boolean
        default: false

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Depuis le 30 octobre 2026, seul TC-109 (notification systeme via la passerelle adb) reste sous
  # Maestro : les autres parcours sont des tests instrumentes (`app/src/androidTest/.../ui/journey`).
  # Un seul flow, donc un seul shard.
  maestro:
    name: Shard ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # L'action telecharge l'emulateur et l'image systeme sans jamais reessayer. Le 23 septembre
      # 2026, une archive tronquee (« Error on ZipFile unknown archive ») a tue le shard 4 avant
      # le demarrage de l'emulateur. Preinstalles ici avec relance, ils sont deja a jour quand
      # l'action lance son propre `sdkmanager`, qui ne retelecharge alors rien.
      - name: Preinstall emulator and system image
        run: |
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator 'system-images;android-36;google_atd;x86_64' > /dev/null && exit 0
            echo "::warning::sdkmanager : tentative $attempt en echec, nouvel essai"
            rm -rf "$ANDROID_HOME/.downloadIntermediates" "$ANDROID_HOME/.temp"
            sleep 15
          done
          exit 1

      # Memoire et charge de l'hote toutes les 5 s, puis logcat de l'emulateur (scripts/ci_diag.sh) :
      # de quoi comprendre une mort silencieuse de l'emulateur.
      - name: Start emulator diagnostics
        run: bash scripts/ci_diag.sh start

      - name: Run Maestro Tests
        id: run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env: &maestro-env
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "600000"
          MAESTRO_CLI_NO_ANALYTICS: "true"
        with: &maestro-emulator
          api-level: 36
          # Image ATD (Automated Test Device) : sans écran, allégée des applications et services
          # inutiles aux tests (Messages, Bien-être numérique, etc., vus dans le logcat du run
          # 42936638392). Variante Google, pas AOSP : elle garde les services Google de l'image
          # précédente (`google_apis`), et l'app utilise ML Kit.
          target: google_atd
          arch: x86_64
          profile: pixel_6
          cores: 2
          force-avd-creation: true
          emulator-options: >
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-metrics -no-snapshot-save -memory 3072
            -change-locale fr-FR
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: true
          # Emulateur en francais, comme l'app et ses tests (voir scripts/ci_wait_locale.sh).
          script: |
            adb wait-for-device
            bash scripts/ci_diag.sh logcat
            bash scripts/ci_wait_locale.sh fr-FR
            bash scripts/ci_install_apk.sh app/build/outputs/apk/debug/app-debug.apk
            mkdir -p build && touch build/ci-tests-started
            bash scripts/ci_run_maestro.sh ${{ matrix.shard }} 1

      # L'emulateur meurt parfois avant le premier flow, pendant le redemarrage du framework que
      # declenche -change-locale (runs des 30 et 31 octobre 2026 : port 5554 ferme, aucun message).
      # Un seul nouvel essai, sur un emulateur neuf, et seulement si aucun flow n'a commence :
      # un echec de test n'est jamais rejoue.
      - name: Run Maestro Tests (nouvel essai, emulateur mort avant les flows)
        id: retry
        if: steps.run.outcome == 'failure' && hashFiles('build/ci-tests-started') == ''
        uses: reactivecircus/android-emulator-runner@v2
        env: *maestro-env
        with: *maestro-emulator

      # Seulement si le nouvel essai n'a pas eu lieu : quand il a lieu, il cree lui-meme
      # `build/ci-tests-started`, et l'ancien test sur ce fichier marquait le job rouge meme apres un
      # nouvel essai vert. Un nouvel essai rouge fait echouer le job par lui-meme.
      - name: Report Maestro failure
        if: steps.run.outcome == 'failure' && steps.retry.outcome == 'skipped'
        run: |
          echo "::error::Flows Maestro en echec : voir l'etape « Run Maestro Tests »."
          exit 1

      - name: Collect emulator diagnostics
        if: always() && (steps.run.outcome == 'failure' || failure())
        run: bash scripts/ci_diag.sh collect

      - name: Upload emulator diagnostics
        if: always() && (steps.run.outcome == 'failure' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics-maestro-${{ matrix.shard }}
          path: build/ci-diag
          retention-days: 7
          if-no-files-found: ignore

      - name: Zip Maestro Results
        if: always()
        run: |
          if [ -d "build/maestro-results" ]; then
            zip -r build/maestro-results-shard-${{ matrix.shard }}.zip build/maestro-results
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-shard-ubuntu-${{ matrix.shard }}
          path: |
            build/maestro-junit-shard-${{ matrix.shard }}.xml
            build/maestro-results-shard-${{ matrix.shard }}.zip

  # Tests instrumentés Compose (`app/src/androidTest`). Job distinct des shards Maestro :
  # même émulateur, signal différent. Un rouge Maestro dénonce un parcours cassé, un rouge
  # instrumenté dénonce un écran. Trois shards depuis le 30 octobre 2026, quand les parcours
  # Maestro y ont été portés : un job seul passait ~4,5 min à démarrer l'émulateur et compiler,
  # puis ~9 min de tests (run du 29 octobre), et c'était le chemin critique du workflow. Le runner
  # répartit les tests par nombre (`numShards` / `shardIndex`), pas par durée.
  instrumented-tests:
    name: Instrumented Tests ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # 45 et non 30 : la place d'une seconde passe complète si l'émulateur meurt en cours de shard.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Meme raison que dans le job `maestro` : telechargement du SDK relance en cas d'archive tronquee.
      - name: Preinstall emulator and system image
        run: |
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator 'system-images;android-36;google_atd;x86_64' > /dev/null && exit 0
            echo "::warning::sdkmanager : tentative $attempt en echec, nouvel essai"
            rm -rf "$ANDROID_HOME/.downloadIntermediates" "$ANDROID_HOME/.temp"
            sleep 15
          done
          exit 1

      # Compiler avant de démarrer l'émulateur. Run 42936638392 : Gradle compilait pendant que
      # l'émulateur tournait (~190 % de CPU, 2,4 Go), charge de 6,3 sur 4 vCPU, ~200 Mo de mémoire
      # libre, émulateur figé dès le premier test. L'étape de l'émulateur trouve ensuite les deux APK
      # à jour et ne fait plus qu'installer et lancer. Compilateur Kotlin dans le processus Gradle :
      # pas de démon Kotlin qui garderait sa mémoire pendant les tests.
      - name: Build app and test APKs
        run: >
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon -x lint
          -Pkotlin.compiler.execution.strategy=in-process

      # Memoire et charge de l'hote toutes les 5 s, puis logcat de l'emulateur (scripts/ci_diag.sh) :
      # de quoi comprendre une mort silencieuse de l'emulateur.
      - name: Start emulator diagnostics
        run: bash scripts/ci_diag.sh start

      - name: Run Instrumented Tests
        id: tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with: &instrumented-emulator
          api-level: 36
          # Image ATD (Automated Test Device) : sans écran, allégée des applications et services
          # inutiles aux tests (Messages, Bien-être numérique, etc., vus dans le logcat du run
          # 42936638392). Variante Google, pas AOSP : elle garde les services Google de l'image
          # précédente (`google_apis`), et l'app utilise ML Kit.
          target: google_atd
          arch: x86_64
          profile: pixel_6
          cores: 2
          force-avd-creation: true
          emulator-options: >
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-metrics -no-snapshot-save -memory 3072
            -change-locale fr-FR ${{ inputs.diag_u01b2 && '-show-kernel' || '' }}
          # Indispensable : sans cela, `waitForIdle` de Compose peut ne jamais rendre la main
          # sur une animation. L'application en a plusieurs, dont son écran de démarrage.
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: true
          # Les deux APK (application et test) sont compilés à l'étape « Build app and test APKs » ;
          # Gradle ne fait plus ici qu'installer et lancer. On ne réutilise pas l'artefact du job
          # `build`, qui ne contient que le premier.
          #
          # Gboard désactivé avant les tests : runs 41701682688 et 41704416757, l'émulateur s'est
          # figé ~5 min 40 après son démarrage, les deux fois juste après que Gboard, focalisé sur
          # un champ, a programmé en boucle le téléchargement de son pack vocal fr-FR. Les tests
          # saisissent par la sémantique Compose et n'ont pas besoin de clavier logiciel.
          script: |
            adb wait-for-device
            bash scripts/ci_diag.sh logcat
            bash scripts/ci_wait_locale.sh fr-FR
            adb shell pm disable-user --user 0 com.google.android.inputmethod.latin || true
            mkdir -p build && touch build/ci-tests-started
            ./gradlew :app:connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.numShards=3 -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard }} -Pandroid.testInstrumentationRunnerArguments.tc162ForceB2=${{ inputs.diag_u01b2 && 'true' || 'false' }}

      # Emulateur mort en cours de shard (run 41701682688 : qemu disparu au 37e cas sur 72) :
      # Gradle ecrit alors « Test run failed to complete » ET « device '…' not found ». Les deux
      # marqueurs ensemble distinguent la perte de l'appareil d'un rouge de test (shard complet)
      # et d'un plantage de l'application (appareil toujours present), jamais relances.
      - name: Detect emulator lost during tests
        id: lost
        if: steps.tests.outcome == 'failure' && hashFiles('build/ci-tests-started') != ''
        run: |
          dir=app/build/outputs/androidTest-results/connected
          if grep -rqs "Test run failed to complete" "$dir" && grep -rqsE "device '[^']+' not found" "$dir"; then
            echo "::warning::Emulateur perdu en cours de shard : une seconde passe complete sur un emulateur neuf."
            mkdir -p build/ci-diag/first-attempt
            cp -r "$dir" build/ci-diag/first-attempt/
            rm -rf "$dir"
            echo "lost=true" >> "$GITHUB_OUTPUT"
          fi

      # Un seul nouvel essai : emulateur mort avant le premier test (redemarrage de
      # -change-locale), ou perdu en cours de shard. Un rouge de test reste rouge.
      - name: Run Instrumented Tests (nouvel essai, emulateur mort)
        id: retry
        if: steps.tests.outcome == 'failure' && (hashFiles('build/ci-tests-started') == '' || steps.lost.outputs.lost == 'true')
        uses: reactivecircus/android-emulator-runner@v2
        with: *instrumented-emulator

      # Seulement si le nouvel essai n'a pas eu lieu. Run 42834564671 (`ef432c8d`) : emulateur
      # disparu pendant le changement de langue, nouvel essai 99/99 vert, job rouge quand meme,
      # parce que le nouvel essai avait cree `build/ci-tests-started`. Un nouvel essai rouge fait
      # echouer le job par lui-meme.
      - name: Report Instrumented failure
        if: steps.tests.outcome == 'failure' && steps.retry.outcome == 'skipped'
        run: |
          echo "::error::Tests instrumentes en echec : voir l'etape « Run Instrumented Tests »."
          exit 1

      - name: Collect emulator diagnostics
        if: always() && (steps.tests.outcome == 'failure' || failure())
        run: bash scripts/ci_diag.sh collect

      - name: Upload emulator diagnostics
        if: always() && (steps.tests.outcome == 'failure' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics-instrumented-${{ matrix.shard }}
          path: build/ci-diag
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Instrumented Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results-${{ matrix.shard }}
          path: |
            app/build/outputs/androidTest-results/connected/**/*.xml
            app/build/reports/androidTests/connected/**

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml

  report:
    name: Merge Results (Ubuntu)
    needs: [maestro, unit-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all shards results
        uses: actions/download-artifact@v4
        with:
          pattern: maestro-shard-ubuntu-*
          path: build/shards
          merge-multiple: true

      - name: Download unit test results
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: build/unit-tests
        continue-on-error: true

      - name: Merge JUnit reports
        run: |
          python3 Maestro/scripts/merge_junit.py build/shards/*.xml -o build/maestro-junit-merged.xml

      - name: Unzip and merge maestro-results
        if: always()
        run: |
          mkdir -p build/unzipped
          i=0
          for z in build/shards/maestro-results-shard-*.zip; do
            [ -f "$z" ] || continue
            mkdir -p "build/unzipped/shard-$i"
            unzip -q "$z" -d "build/unzipped/shard-$i"
            i=$((i + 1))
          done
          python3 Maestro/scripts/merge_maestro_results.py \
            build/unzipped/shard-*/build/maestro-results \
            -o build/maestro-results-merged
          zip -r build/maestro-results-merged.zip build/maestro-results-merged

      - name: Upload Merged JUnit Report
        uses: actions/upload-artifact@v4
        with:
          name: maestro-junit-ubuntu-merged
          path: build/maestro-junit-merged.xml

      - name: Upload Merged Maestro Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-results-merged
          path: build/maestro-results-merged.zip

      - name: Checkout gh-pages (history)
        uses: actions/checkout@v4
        if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        with:
          ref: gh-pages
          path: .gh-pages-history

      - name: Setup Allure
        if: always()
        run: |
          ALLURE_VERSION=2.30.0
          wget https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.tgz
          tar -zxf allure-$ALLURE_VERSION.tgz
          echo "$(pwd)/allure-$ALLURE_VERSION/bin" >> $GITHUB_PATH

      - name: Generate Allure Results
        if: always()
        run: |
          mkdir -p build/allure-results
          # Inject history if available
          if [ -d ".gh-pages-history/history" ]; then
            cp -r .gh-pages-history/history build/allure-results/
          fi
          
          # Add unit test results to allure-results
          if [ -d "build/unit-tests" ]; then
            cp build/unit-tests/*.xml build/allure-results/
          fi
          
          python3 Maestro/scripts/maestro_to_allure.py \
            --junit build/maestro-junit-merged.xml \
            --results build/maestro-results-merged \
            --output build/allure-results

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate build/allure-results -o build/allure-report --clean

      - name: Deploy to GitHub Pages
        if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/allure-report
