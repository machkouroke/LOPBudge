name: Maestro UI (Ubuntu)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  maestro:
    name: Shard ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro Tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "600000"
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics -no-snapshot-save -memory 3072
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 Maestro/scripts/shard_flows.py \
              --index ${{ matrix.shard }} \
              --count 2 \
              --write-config /tmp/maestro-shard.yaml
            cat /tmp/maestro-shard.yaml
            maestro test --config /tmp/maestro-shard.yaml Maestro/ \
              --format junit \
              --output build/maestro-junit-shard-${{ matrix.shard }}.xml \
              --test-output-dir build/maestro-results

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-shard-ubuntu-${{ matrix.shard }}
          path: |
            build/maestro-junit-shard-${{ matrix.shard }}.xml
            build/maestro-results

  report:
    name: Merge Results (Ubuntu)
    needs: maestro
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all shards results
        uses: actions/download-artifact@v4
        with:
          pattern: maestro-shard-ubuntu-*
          path: build/shards
          merge-multiple: true

      - name: Merge JUnit reports
        run: |
          python3 Maestro/scripts/merge_junit.py build/shards/*.xml -o build/maestro-junit-merged.xml

      - name: Upload Merged Report
        uses: actions/upload-artifact@v4
        with:
          name: maestro-junit-ubuntu-merged
          path: build/maestro-junit-merged.xml
