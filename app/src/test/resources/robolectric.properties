# Robolectric 4.12 ne connaît pas d'image système au-delà du SDK 34, or le projet vise le 35.
# Dès que les ressources Android sont exposées aux tests, tout test Robolectric sans @Config
# explicite échoue au démarrage sur « targetSdkVersion=35 > maxSdkVersion=34 ».
#
# Cette valeur par défaut reprend celle que les tests Room du dépôt posent déjà un par un
# (@Config(sdk = [33])). À relever quand Robolectric suivra le targetSdk.
sdk=33
