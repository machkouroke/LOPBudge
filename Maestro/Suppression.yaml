appId: com.lop.budget
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    text: "Rechercher"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 10000
- tapOn: 
    text: "Titre, notes..."
    waitToSettleTimeoutMs: 10000
- inputText: "Loyer"
- tapOn: 
    text: "Récurrent"
    waitToSettleTimeoutMs: 10000
- tapOn:
    text: "Loyer"
    index: 1
    waitToSettleTimeoutMs: 10000
- tapOn: 
    text: "Supprimer"
    waitToSettleTimeoutMs: 10000
- tapOn: 
    text: "Cette occurrence"
    waitToSettleTimeoutMs: 10000
- killApp:
      appId: "com.lop.budget"

