appId: com.lop.budget
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    text: "Rechercher"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 10000
- tapOn: 
    text: "Titre, notes..."
    waitToSettleTimeoutMs: 10000
# On efface d'abord au cas où le bégaiement aurait déjà écrit des lettres
- eraseText: 10
- inputText: "Loyer"
- hideKeyboard
- tapOn: 
    text: "Récurrent"
    waitToSettleTimeoutMs: 10000
- tapOn:
    text: "Loyer"
    index: 1
    waitToSettleTimeoutMs: 10000
- tapOn: 
    text: "Supprimer"
    waitToSettleTimeoutMs: 10000
- tapOn: 
    text: "Cette occurrence"
    waitToSettleTimeoutMs: 10000
- stopApp
