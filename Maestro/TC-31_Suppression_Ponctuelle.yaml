appId: com.lop.budget
name: "TC-31: Suppression Transaction Ponctuelle"
---
# TC-31 - Gherkin UI — Transaction ponctuelle sans portée
# Vérifier qu'une transaction normale se supprime sans proposer de portées.

- launchApp:
    clearState: true

- tapOn: "Courses Hebdomadaires"
- tapOn:
    id: "transaction.detail.delete"

# On ne doit pas voir la Bottom Sheet de récurrence
- assertNotVisible:
    id: "recurring.delete.scope.sheet"
- assertNotVisible: "Cette occurrence"

# Mais on doit voir le dialogue de confirmation standard
- assertVisible:
    id: "transaction.delete.confirm.dialog"
- tapOn:
    id: "transaction.delete.confirm.submit"

- assertNotVisible: "Courses Hebdomadaires"
- assertVisible: "Loyer" # La série de contrôle est intacte
