appId: com.lop.budget
---
# subflow: clear_text_field.yaml
# Description: Sélectionne tout le texte d'un champ et le supprime intelligemment
# Paramètres: 
#   - target_id: l'ID de l'élément cible

# 1. Focus le champ pour garantir que le curseur est prêt
- tapOn:
    id: ${target_id}

# 2. Long press pour faire apparaître le menu contextuel
- longPressOn:
    id: ${target_id}

# 3. Laisser le temps au menu système d'apparaître (critique en CI)
# On attend jusqu'à 2s, mais c'est optionnel pour ne pas faire échouer si c'est dans l'overflow
- extendedWaitUntil:
    visible: "Tout sélectionner|Select all"
    timeout: 2000
    optional: true

- runFlow:
    when:
      notVisible: "Tout sélectionner|Select all"
    commands:
      # Si vraiment absent, on tente l'overflow
      - tapOn:
          id: "android:id/overflow"
          optional: true
      - tapOn:
          text: "Options supplémentaires|Plus d'options|More options"
          optional: true

# 4. Sélectionner tout (on utilise un sélecteur explicite pour la regex)
- tapOn:
    text: "Tout sélectionner|Select all"

# 5. Supprimer
- eraseText: 1
