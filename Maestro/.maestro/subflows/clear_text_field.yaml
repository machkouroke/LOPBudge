appId: com.lop.budget
---
# subflow: clear_text_field.yaml
# Description: Vide un champ de saisie.
# Paramètres:
#   - target_id: l'ID de l'élément cible
#
# Pourquoi ne PAS passer par « Tout sélectionner »
# ------------------------------------------------
# La version précédente faisait un appui long puis cherchait l'entrée « Tout sélectionner »
# de la barre de sélection de texte d'Android, avec un repli sur l'overflow système. Trois
# problèmes, tous mesurés le 16 septembre 2026 :
#   - cette barre appartient au système, pas à l'application : sa forme, son délai
#     d'apparition et le fait que « Tout sélectionner » soit visible ou replié dans
#     l'overflow dépendent de l'OEM et de la largeur d'écran. Un Samsung et un émulateur
#     AOSP ne se comportent pas pareil, d'où des rouges qui ne se reproduisent pas ;
#   - le `tapOn` final n'est pas `optional` : si la barre tarde, le flow échoue sur un
#     menu système, à un endroit qui n'a aucun rapport avec la règle métier testée ;
#   - le sous-flow consommait ~20 s, soit 15 % du temps de TC-35-4 à lui seul.
#
# `eraseText` supprime les caractères directement via l'IME, sans aucune fenêtre système.
- tapOn:
    id: ${target_id}

# 50 caractères : au-delà de tout libellé ou montant saisi par la suite. Effacer plus que
# le contenu n'a aucun effet de bord, le champ est simplement vide.
- eraseText: 50
