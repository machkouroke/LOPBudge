appId: com.lop.budget
---
# subflow: clear_text_field.yaml
# Description: Sélectionne tout le texte d'un champ et le supprime intelligemment
# Paramètres: 
#   - target_id: l'ID de l'élément cible

- longPressOn:
    id: ${target_id}

# Si "Tout sélectionner" n'est pas visible directement, on passe par les options supplémentaires
- runFlow:
    when:
      notVisible: "Tout sélectionner"
    commands:
      # On tente l'ID standard Android, ou les variantes de texte fr/en
      - tapOn:
          id: "android:id/overflow"
          optional: true
      - tapOn:
          text: "Plus d'options"
          optional: true
      - tapOn:
          text: "Options supplémentaires"
          optional: true
      - tapOn:
          text: "More options"
          optional: true

- tapOn: "Tout sélectionner"
- eraseText: 1
