appId: com.lop.budget
---
# Subflow pour ouvrir l'historique complet des transactions
# Évite le clic si on est déjà sur l'écran mensuel

- runFlow:
    when:
      notVisible: { id: "screen.monthly" }
    commands:
      # S'assurer que le bouton est dégagé du FAB +
      - scrollUntilVisible:
          element:
            id: "recent_transactions_see_all"
          direction: DOWN
          centerElement: true
      - tapOn:
          id: "recent_transactions_see_all"
      - assertVisible:
          id: "screen.monthly"
- waitForAnimationToEnd:
    timeout: 5000
