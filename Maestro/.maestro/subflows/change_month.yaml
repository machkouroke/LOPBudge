appId: com.lop.budget
---
# Subflow pour changer de mois et revenir sur l'historique
# Paramètres attendus : 
#   month_name : label du mois (ex: "Août")
#   year : année cible (ex: 2024)

- evalScript: |
    console.log("Subflow Navigation -> Month: " + month_name + " Year: " + year);

# Retour à la Home par étapes tant que le picker n'est pas visible
- repeat:
    while:
      notVisible: { id: "home.month.picker" }
    commands:
      - tapOn: { id: "common.btn.back" }

# On ouvre le picker
- tapOn: { id: "home.month.picker" }

# Gestion dynamique de l'année
- runFlow:
    when:
      true: ${year > output.CURRENT_YEAR}
    commands:
      - evalScript: console.log("Triggering NEXT Year");
      - tapOn: "Année suivante"

- runFlow:
    when:
      true: ${year < output.CURRENT_YEAR}
    commands:
      - evalScript: console.log("Triggering PREVIOUS Year");
      - tapOn: "Année précédente"

# Sélection du mois
- tapOn: ${month_name}

# Retour historique
- runFlow: open_monthly_history.yaml
