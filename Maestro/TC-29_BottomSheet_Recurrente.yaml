appId: com.lop.budget
name: "TC-29: Validation Bottom Sheet Suppression"
---
# TC-29 - Gherkin UI — Bottom sheet suppression récurrente
- launchApp:
    clearState: true

# Navigation vers l'historique complet pour assurer la visibilité
- runFlow: .maestro/subflows/open_monthly_history.yaml

# Étape 1 : Vérification via Swipe
- swipe:
    from: 
      id: "transaction.item.title"
      text: "Loyer"
    direction: LEFT
- tapOn:
    id: "transaction.item.delete"
- assertVisible:
    id: "recurring.delete.scope.sheet"
- tapOn: "Annuler"
- assertVisible: "Loyer"

# Étape 2 : Vérification via Détail
- runFlow:
    file: .maestro/subflows/delete_occurrence.yaml
    env:
      text: "Loyer"
- assertVisible:
    id: "recurring.delete.scope.sheet"
- tapOn: "Annuler"
- tapOn:
    id: "common.btn.back"
- assertVisible:
    id: "screen.monthly"

# Étape 3 : Vérification via Appui long (Popup)
- longPressOn: "Loyer"
- assertVisible: "Supprimer"
- tapOn:
    id: "transaction.detail.delete"
- assertVisible:
    id: "recurring.delete.scope.sheet"
- tapOn: "Annuler"
- assertVisible: "Loyer"
