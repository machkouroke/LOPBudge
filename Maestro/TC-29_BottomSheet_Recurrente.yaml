appId: com.lop.budget
name: "TC-29: Validation Bottom Sheet Suppression"
---
# TC-29 - Gherkin UI — Bottom sheet suppression récurrente
- launchApp:
    clearState: true

- runFlow: .maestro/subflows/open_monthly_history.yaml

# Étape 1 : Vérification via Swipe (désactivé temporairement car instable avec Maestro)

# Étape 2 : Vérification via Détail
- evalScript: |
    console.log("Étape 2 : Vérification via Détail")
- runFlow:
    file: .maestro/subflows/delete_occurrence.yaml
    env:
      text: "Loyer"

# Vérification présence des 3 options (CA-03)
- assertVisible: "Cette occurrence"
- assertVisible: "Les suivantes uniquement"
- assertVisible: "Toute la série"

- tapOn: "Annuler"
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.monthly" }

# Étape 3 : Vérification via Appui long (Popup)
- evalScript: |
    console.log("Étape 3 : Vérification via Appui long (Popup)")
- longPressOn: "Loyer"
- assertVisible: "Supprimer"
- tapOn: { id: "transaction.detail.delete" }
- assertVisible: "Cette occurrence"
- tapOn: "Annuler"
- assertVisible: "Loyer"
