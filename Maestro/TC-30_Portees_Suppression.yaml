appId: com.lop.budget
name: "TC-30: Impact des Portées de Suppression"
---
# TC-30 - Gherkin UI — Portées suppression récurrente

# --- CAS 1 : "Cette occurrence" ---
- launchApp:
    clearState: true
- runFlow: .maestro/subflows/open_monthly_history.yaml
- runFlow:
    file: .maestro/subflows/delete_occurrence.yaml
    env:
      text: "Loyer"
      scope: "Cette occurrence"

- assertNotVisible: "Loyer"

# Vérifier le mois suivant via subflow (Gère le retour)
- runFlow:
    file: .maestro/subflows/change_month.yaml
    env:
      month_name: "Sept."
- assertVisible: "Loyer"

# --- CAS 2 : "Les suivantes uniquement" ---
- launchApp:
    clearState: true
- runFlow: .maestro/subflows/open_monthly_history.yaml
- runFlow:
    file: .maestro/subflows/delete_occurrence.yaml
    env:
      text: "Loyer"
      scope: "Les suivantes uniquement"

- assertNotVisible: "Loyer"

# Vérifier Septembre (doit être absent)
- runFlow:
    file: .maestro/subflows/change_month.yaml
    env:
      month_name: "Sept."
- assertNotVisible: "Loyer"

# Vérifier Juillet (doit être présent)
- runFlow:
    file: .maestro/subflows/change_month.yaml
    env:
      month_name: "Juil."
- assertVisible: "Loyer"

# --- CAS 3 : "Toute la série" ---
- launchApp:
    clearState: true
- runFlow: .maestro/subflows/open_monthly_history.yaml
- runFlow:
    file: .maestro/subflows/delete_occurrence.yaml
    env:
      text: "Loyer"
      scope: "Toute la série"

- assertNotVisible: "Loyer"

# Vérifier Juillet (doit être absent maintenant)
- runFlow:
    file: .maestro/subflows/change_month.yaml
    env:
      month_name: "Juil."
- assertNotVisible: "Loyer"
