appId: com.lop.budget
name: "TC-30: Impact des Portées de Suppression"
---
# TC-30 - Gherkin UI — Portées suppression récurrente
# Vérifier l'impact réel des 3 portées sur l'affichage.

- launchApp:
    clearState: true

# --- CAS 1 : "Cette occurrence" ---
- tapOn: "Loyer"
- tapOn:
    id: "transaction.detail.delete"
- tapOn: "Cette occurrence"
- tapOn:
    id: "transaction.delete.confirm.submit"
- assertNotVisible: "Loyer"
- assertVisible: "Salaire" # Contrôle : Autre série non impactée

# Vérifier le mois suivant (Septembre si on est en Août)
- tapOn:
    id: "home.month.picker"
- tapOn: "Sept." # Abréviation FR
- assertVisible: "Loyer" # Le futur doit être présent

# --- CAS 2 : "Les suivantes uniquement" ---
- launchApp:
    clearState: true
- tapOn: "Loyer"
- tapOn:
    id: "transaction.detail.delete"
- tapOn: "Les suivantes uniquement"
- tapOn:
    id: "transaction.delete.confirm.submit"
- assertNotVisible: "Loyer"
# Vérifier le mois suivant
- tapOn:
    id: "home.month.picker"
- tapOn: "Sept."
- assertNotVisible: "Loyer" # Le futur est tronqué
# Vérifier le mois précédent
- tapOn:
    id: "home.month.picker"
    index: 0
- tapOn: "Juil."
- assertVisible: "Loyer" # Le passé reste visible

# --- CAS 3 : "Toute la série" ---
- launchApp:
    clearState: true
- tapOn: "Loyer"
- tapOn:
    id: "transaction.detail.delete"
- tapOn: "Toute la série"
- tapOn:
    id: "transaction.delete.confirm.submit"
- assertNotVisible: "Loyer"
- tapOn:
    id: "home.month.picker"
- tapOn: "Juil."
- assertNotVisible: "Loyer" # Même le passé disparait
