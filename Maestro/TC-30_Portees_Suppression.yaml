appId: com.lop.budget
name: "TC-30: Impact des Portées de Suppression"
---
# TC-30 - Gherkin UI — Portées suppression récurrente

# Initialisation des dates relatives
- runScript: scripts/dates.js

- evalScript: |
    console.log("Starting TC-30 with Dynamic Dates:");
    console.log("PREV: " + output.PREV_MONTH_NAME + " " + PREV_YEAR);
    console.log("NEXT: " + output.NEXT_MONTH_NAME + " " + NEXT_YEAR);

# --- Scénario 1 : "Cette occurrence" ---
- evalScript: |
    console.log("--- Scénario 1 : 'Cette occurrence' ---")
- launchApp:
    clearState: true

- runFlow: .maestro/subflows/open_monthly_history.yaml
- runFlow:
    file: .maestro/subflows/delete_occurrence.yaml
    env:
      text: "Loyer"
      scope: "Cette occurrence"

- assertVisible: { id: "screen.monthly" }
- assertNotVisible: "Loyer"

# Vérifier le mois suivant
- evalScript: |
    console.log("Vérifier le mois suivant")
- runFlow:
    file: .maestro/subflows/change_month.yaml
    env:
      month_name: ${output.NEXT_MONTH_NAME}
      year: ${output.NEXT_YEAR}
- assertVisible: { id: "screen.monthly" }
- assertVisible: "Loyer"

# --- Scénario 2 : "Les suivantes uniquement" ---
- evalScript: |
    console.log("--- Scénario 2 : 'Les suivantes uniquement' ---")
