appId: com.lop.budget
name: "TC-30: Impact des Portées de Suppression"
---
# TC-30 - Gherkin UI — Portées suppression récurrente

# --- CAS 1 : "Cette occurrence" ---
- launchApp:
    clearState: true
- runFlow: .maestro/subflows/open_monthly_history.yaml
- runFlow:
    file: .maestro/subflows/delete_occurrence.yaml
    env:
      text: "Loyer"
- tapOn: "Cette occurrence"
- tapOn: "Supprimer"

# Vérification Robuste : On vérifie qu'on est revenu sur l'écran mensuel avant de checker l'absence
- assertVisible:
    id: "screen.monthly"
- assertNotVisible: "Loyer"

# Vérifier le mois suivant
- tapOn:
    id: "home.month.picker"
- tapOn: "Sept."
- assertVisible:
    id: "screen.monthly"
- assertVisible: "Loyer"

# --- CAS 2 : "Les suivantes uniquement" ---
- launchApp:
    clearState: true
- runFlow: .maestro/subflows/open_monthly_history.yaml
- runFlow:
    file: .maestro/subflows/delete_occurrence.yaml
    env:
      text: "Loyer"
- tapOn: "Les suivantes uniquement"
- tapOn: "Supprimer"

- assertVisible:
    id: "screen.monthly"
- assertNotVisible: "Loyer"

# Vérifier Septembre
- tapOn:
    id: "home.month.picker"
- tapOn: "Sept."
- assertVisible:
    id: "screen.monthly"
- assertNotVisible: "Loyer"

# Vérifier Juillet
- tapOn:
    id: "home.month.picker"
- tapOn: "Juil."
- assertVisible:
    id: "screen.monthly"
- assertVisible: "Loyer"

# --- CAS 3 : "Toute la série" ---
- launchApp:
    clearState: true
- runFlow: .maestro/subflows/open_monthly_history.yaml
- runFlow:
    file: .maestro/subflows/delete_occurrence.yaml
    env:
      text: "Loyer"
- tapOn: "Toute la série"
- tapOn: "Supprimer"

- assertVisible:
    id: "screen.monthly"
- assertNotVisible: "Loyer"

# Vérifier Juillet
- tapOn:
    id: "home.month.picker"
- tapOn: "Juil."
- assertVisible:
    id: "screen.monthly"
- assertNotVisible: "Loyer"
