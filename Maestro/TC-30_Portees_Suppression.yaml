      text: "Loyer"
      scope: "Toute la série"

- assertVisible: { id: "screen.monthly" }
- assertNotVisible: "Loyer"

# Vérifier le mois précédent (Absent maintenant)
- evalScript: |
    console.log("Vérifier le mois suivant (Absent maintenant)")
