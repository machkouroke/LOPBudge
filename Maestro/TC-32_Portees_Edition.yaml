appId: com.lop.budget
name: "TC-32: Validation Portées Édition"
---
# TC-32 - Gherkin UI — Choix de portée édition récurrente
# Objectif : Vérifier que l'UI adapte l'écran d'édition selon la portée choisie.

- launchApp:
    clearState: true

# Préparation : Ouvrir l'historique mensuel
- runFlow: .maestro/subflows/open_monthly_history.yaml

# --- SCÉNARIO 1 : Portée 'SINGLE' ---
- evalScript: |
    console.log("--- CAS 1 : 'Cette occurrence uniquement' ---")

- tapOn: "Loyer"
- assertVisible: { id: "screen.transaction.detail" }
- tapOn: { id: "transaction.detail.edit" }

# Attendre que la BottomSheet soit bien là
- assertVisible: "Modifier la transaction ?"

# Cliquer sur SINGLE
- tapOn: "Cette occurrence uniquement"

# Attendre l'écran d'édition (via le bouton Enregistrer, plus stable qu'un Scaffold tag)
- extendedWaitUntil:
    visible:
      id: "common.btn.save"
    timeout: 5000

# Vérifier que le bloc récurrence est MASQUÉ (CA-16)
- assertNotVisible: { id: "transaction.edit.block.recurrence" }

- tapOn: { id: "common.btn.back" }
- tapOn: { id: "common.btn.back" }

# --- SCÉNARIO 2 : Portée 'FUTURE' ---
- evalScript: |
    console.log("--- CAS 2 : 'Cette occurrence et les suivantes' ---")

- tapOn: "Loyer"
- tapOn: { id: "transaction.detail.edit" }
- assertVisible: "Modifier la transaction ?"

# Cliquer sur FUTURE
- tapOn: "Cette occurrence et les suivantes"

# Attendre l'écran d'édition
- extendedWaitUntil:
    visible:
      id: "common.btn.save"
    timeout: 5000

# Vérifier que le bloc récurrence est VISIBLE (CA-17)
- assertVisible: { id: "transaction.edit.block.recurrence" }

- tapOn: { id: "common.btn.back" }
- tapOn: { id: "common.btn.back" }

# --- SCÉNARIO 3 : Portée 'ALL' ---
- evalScript: |
    console.log("--- CAS 3 : 'Toute la série' ---")

- tapOn: "Loyer"
- tapOn: { id: "transaction.detail.edit" }
- assertVisible: "Modifier la transaction ?"

# Cliquer sur ALL
- tapOn: "Toute la série"

# Attendre l'écran d'édition
- extendedWaitUntil:
    visible:
      id: "common.btn.save"
    timeout: 5000

# Vérifier que le bloc récurrence est VISIBLE (CA-17)
- assertVisible: { id: "transaction.edit.block.recurrence" }

- tapOn: { id: "common.btn.back" }
- tapOn: { id: "common.btn.back" }
