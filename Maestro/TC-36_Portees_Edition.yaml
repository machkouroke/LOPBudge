appId: com.lop.budget
name: "TC-36: Validation Portées Édition"
---
# TC-36 - Gherkin UI — Choix de portée édition récurrente
# Objectif : Vérifier que l'UI adapte l'écran d'édition selon la portée choisie.

- launchApp:
    clearState: true

# Préparation : Ouvrir l'historique mensuel
- runFlow: .maestro/subflows/open_monthly_history.yaml

# --- SCÉNARIO 1 : Portée 'SINGLE' ---
- evalScript: |
    console.log("--- CAS 1 : 'Cette occurrence uniquement' ---")

- runFlow:
    file: .maestro/subflows/navigate_to_edit.yaml
    env:
      transactionName: "Loyer"
      scopeSelection: "Cette occurrence uniquement"

# Vérifier que le bloc récurrence est MASQUÉ (CA-16)
- assertNotVisible: { id: "transaction.edit.block.recurrence" }

- tapOn: { id: "common.btn.back" }
- tapOn: { id: "common.btn.back" }

# --- SCÉNARIO 2 : Portée 'FUTURE' ---
- evalScript: |
    console.log("--- CAS 2 : 'Cette occurrence et les suivantes' ---")

- runFlow:
    file: .maestro/subflows/navigate_to_edit.yaml
    env:
      transactionName: "Loyer"
      scopeSelection: "Cette occurrence et les suivantes"

# Vérifier que le bloc récurrence est VISIBLE (CA-17)
# Utilisation de scrollUntilVisible car le bloc est en bas de page
- scrollUntilVisible:
    element: { id: "transaction.edit.block.recurrence" }
    direction: DOWN
    timeout: 5000

- tapOn: { id: "common.btn.back" }
- tapOn: { id: "common.btn.back" }

# --- SCÉNARIO 3 : Portée 'ALL' ---
- evalScript: |
    console.log("--- CAS 3 : 'Toute la série' ---")

- runFlow:
    file: .maestro/subflows/navigate_to_edit.yaml
    env:
      transactionName: "Loyer"
      scopeSelection: "Toute la série"

# Vérifier que le bloc récurrence est VISIBLE (CA-17)
- scrollUntilVisible:
    element: { id: "transaction.edit.block.recurrence" }
    direction: DOWN
    timeout: 5000

- tapOn: { id: "common.btn.back" }
- tapOn: { id: "common.btn.back" }
