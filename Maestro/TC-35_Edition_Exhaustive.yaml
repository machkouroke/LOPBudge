appId: com.lop.budget
name: "TC-35: Édition Exhaustive"
---
# TC-35 - Maestro — Édition exhaustive (Normale + Récurrente)
# Objectif : Vérifier le pré-remplissage intégral et la propagation selon la portée.

# ==========================================
# SCÉNARIO 1 : Transaction Normale
# ==========================================
- runScript: scripts/dates.js

- evalScript: |
    console.log("Starting TC-30 with Dynamic Dates:");
    console.log("PREV: " + output.PREV_MONTH_NAME + " " + PREV_YEAR);
    console.log("NEXT: " + output.NEXT_MONTH_NAME + " " + NEXT_YEAR);
- launchApp:
    clearState: true

- runFlow: .maestro/subflows/open_monthly_history.yaml

- evalScript: |
    console.log("--- CAS 1 : Transaction ponctuelle (Courses Hebdomadaires) ---")

# Utilisation des JDD exacts du DatabaseSeeder
- tapOn: "Courses Hebdomadaires"
- assertVisible: { id: "screen.transaction.detail" }
- tapOn: { id: "transaction.detail.edit" }

# Vérifier accès direct (Pas de BottomSheet)
- assertVisible: { id: "screen.transaction.edit" }

# VÉRIFICATION EXHAUSTIVE PRÉ-REMPLISSAGE (Data-Binding)
- assertVisible:
    id: "transaction.edit.field.title"
    text: "Courses Hebdomadaires"
- assertVisible:
    id: "transaction.edit.field.amount"
    text: "84.2"

# Validation via Marqueur Debug ✅
- assertVisible: "Dépense ✅"

- assertVisible: "Courses"
- assertVisible: "Compte courant"

# Vérifier que le bloc récurrence est MASQUÉ (car ponctuel)
# On scrolle pour être sûr de ne pas le rater en bas
- scrollUntilVisible:
    element: { id: "transaction.edit.block.recurrence" }

- scrollUntilVisible:
    element: { id: "transaction.edit.field.title" }
    direction: UP

# Modifier et enregistrer (Fiabilisation Saisie)
- tapOn: { id: "transaction.edit.field.title" }
# On efface deux fois pour garantir le champ vide (Input Safety)

- longPressOn: { id: "transaction.edit.field.title" }
- tapOn: "Tout sélectionner"
- eraseText: 1

- inputText: "Courses Hebdo"
- hideKeyboard
- tapOn: { id: "common.btn.save" }

# Vérifier retour et modification effective
- extendedWaitUntil:
    visible: { id: "screen.transaction.detail" }
    timeout: 5000
- assertVisible: "Courses Hebdo"

# ==========================================
# SCÉNARIO 2 : Portée 'SINGLE' (Isolation)
# ==========================================
- launchApp:
    clearState: true

- runFlow: .maestro/subflows/open_monthly_history.yaml

- evalScript: |
    console.log("--- CAS 2 : Portée SINGLE (Loyer) ---")

- tapOn: "Loyer"
- tapOn: { id: "transaction.detail.edit" }
- tapOn: "Cette occurrence uniquement"

- extendedWaitUntil:
    visible: { id: "common.btn.save" }
    timeout: 5000

# VÉRIFICATION EXHAUSTIVE
- assertVisible:
    id: "transaction.edit.field.title"
    text: "Loyer"
- assertVisible:
    id: "transaction.edit.field.amount"
    text: "820.0"

- assertVisible: "Dépense ✅"
- assertVisible: "Loyer"
- assertVisible: "Compte courant"

# Vérifier que le bloc récurrence est MASQUÉ (car portée SINGLE)
- repeat:
    times: 2
    commands:
      - scroll
- assertNotVisible: { id: "transaction.edit.block.recurrence" }

- scrollUntilVisible:
    element: { id: "transaction.edit.field.amount" }
    direction: UP

# Modifier montant à 950 (Input Safety)
- longPressOn: { id: "transaction.edit.field.amount" }
- tapOn: "Tout sélectionner"
- eraseText: 1
- inputText: "950"
- hideKeyboard
- tapOn: { id: "common.btn.save" }

# Vérification Isolation (Scan M-1)
- extendedWaitUntil:
    visible: { id: "screen.transaction.detail" }
    timeout: 5000
- assertVisible: { id: "transaction.detail.field.amount" }
- assertVisible: "950,00.*"


# Vérifier le mois précédent
- evalScript: |
      console.log("Vérifier le mois précédent")
- runFlow:
      file: .maestro/subflows/change_month.yaml
      env:
          month_name: ${output.PREVIOUS_MONTH_NAME}
          year: ${output.PREVIOUS_YEAR}
- assertVisible:
    id: "transaction.item.amount"
    text: "/820,00.*/"
- assertNotVisible: "/950,00.*/"

# Vérifier le mois suivant
- evalScript: |
      console.log("Vérifier le mois suivant")
- runFlow:
    file: .maestro/subflows/change_month.yaml
    env:
      month_name: ${output.NEXT_MONTH_NAME}
      year: ${output.NEXT_YEAR}
- assertVisible:
    id: "transaction.item.amount"
    text: "/820,00.*/"
- assertNotVisible: "/950,00.*/"

# ==========================================
# SCÉNARIO 3 : Portée 'FUTURE' (Troncature)
# ==========================================
- launchApp:
    clearState: true

- runFlow: .maestro/subflows/open_monthly_history.yaml

- evalScript: |
    console.log("--- CAS 3 : Portée FUTURE (Loyer Structure) ---")

- tapOn: "Loyer"
- tapOn: { id: "transaction.detail.edit" }
- tapOn: "Cette occurrence et les suivantes"

- extendedWaitUntil:
    visible: { id: "common.btn.save" }
    timeout: 5000

# VÉRIFICATION PRÉ-REMPLISSAGE RÉCURRENCE (EXHAUSTIF)
- scrollUntilVisible:
    element: { id: "transaction.edit.block.recurrence" }

- assertVisible: "Dépense ✅"
- assertVisible: "Tous les mois ✅"

- tapOn: { id: "transaction.edit.btn.advanced" }
- assertVisible:
    id: "transaction.edit.field.interval"
    text: "1"

# Modifier Titre pour le futur (Input Safety)
- tapOn: { id: "transaction.edit.field.title" }
- eraseText
- eraseText
- inputText: "Loyer Paris"
- hideKeyboard
- tapOn: { id: "common.btn.save" }

# Vérification Troncature
- extendedWaitUntil:
    visible: { id: "screen.monthly" }
    timeout: 5000
- assertVisible: "Loyer Paris"

- runFlow:
    file: .maestro/subflows/change_month.yaml
    env:
      direction: "PREVIOUS"
- assertVisible: "Loyer"
- assertNotVisible: "Loyer Paris"

# ==========================================
# SCÉNARIO 4 : Portée 'ALL' (Global)
# ==========================================
- launchApp:
    clearState: true

- runFlow: .maestro/subflows/open_monthly_history.yaml

- evalScript: |
    console.log("--- CAS 4 : Portée ALL (Loyer Global) ---")

- tapOn: "Loyer"
- tapOn: { id: "transaction.detail.edit" }
- tapOn: "Toute la série"

- extendedWaitUntil:
    visible: { id: "common.btn.save" }
    timeout: 5000

- assertVisible: "Dépense ✅"
- assertVisible: "Tous les mois ✅"

# Modifier globalement (Input Safety)
- tapOn: { id: "transaction.edit.field.title" }
- eraseText
- eraseText
- inputText: "Loyer Total"
- hideKeyboard
- tapOn: { id: "common.btn.save" }

# Vérifier propagation partout
- extendedWaitUntil:
    visible: { id: "screen.monthly" }
    timeout: 5000
- assertVisible: "Loyer Total"

- runFlow:
    file: .maestro/subflows/change_month.yaml
    env:
      direction: "PREVIOUS"
- assertVisible: "Loyer Total"
