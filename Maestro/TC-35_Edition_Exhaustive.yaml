appId: com.lop.budget
name: "TC-35: Édition Exhaustive"
---
# TC-35 - Maestro — Édition exhaustive (Normale + Récurrente)
# Objectif : Vérifier le pré-remplissage intégral et la propagation selon la portée.

# ==========================================
# SCÉNARIO 1 : Transaction Normale
# ==========================================
- launchApp:
    clearState: true

- runFlow: .maestro/subflows/open_monthly_history.yaml

- evalScript: |
    console.log("--- CAS 1 : Transaction ponctuelle (Courses Hebdomadaires) ---")

# Utilisation des JDD exacts du DatabaseSeeder
- tapOn: "Courses Hebdomadaires"
- assertVisible: { id: "screen.transaction.detail" }
- tapOn: { id: "transaction.detail.edit" }

# Vérifier accès direct (Pas de BottomSheet)
- assertVisible: { id: "screen.transaction.edit" }

# VÉRIFICATION EXHAUSTIVE PRÉ-REMPLISSAGE (Data-Binding)
- assertVisible:
    id: "transaction.edit.field.title"
    text: "Courses Hebdomadaires"
- assertVisible:
    id: "transaction.edit.field.amount"
    text: "84.2"

# Validation via Marqueur Debug Textuel ✅
- assertVisible: "Dépense ✅"

- assertVisible: "Courses"
- assertVisible: "Compte courant"

# Modifier et enregistrer
- tapOn: { id: "transaction.edit.field.title" }
- eraseText
- inputText: "Courses Hebdo"
- tapOn: { id: "common.btn.save" }

# Vérifier retour et modification effective
- extendedWaitUntil:
    visible: { id: "screen.monthly" }
    timeout: 5000
- assertVisible: "Courses Hebdo"

# ==========================================
# SCÉNARIO 2 : Portée 'SINGLE' (Isolation)
# ==========================================
- launchApp:
    clearState: true

- runFlow: .maestro/subflows/open_monthly_history.yaml

- evalScript: |
    console.log("--- CAS 2 : Portée SINGLE (Loyer) ---")

- tapOn: "Loyer"
- tapOn: { id: "transaction.detail.edit" }
- tapOn: "Cette occurrence uniquement"

- extendedWaitUntil:
    visible: { id: "common.btn.save" }
    timeout: 5000

# VÉRIFICATION EXHAUSTIVE
- assertVisible:
    id: "transaction.edit.field.title"
    text: "Loyer"
- assertVisible:
    id: "transaction.edit.field.amount"
    text: "820.0"

- assertVisible: "Dépense ✅"
- assertVisible: "Loyer"
- assertVisible: "Compte courant"

# Modifier montant à 950
- tapOn: { id: "transaction.edit.field.amount" }
- eraseText
- inputText: "950"
- tapOn: { id: "common.btn.save" }

# Vérification Isolation (Scan M-1)
- extendedWaitUntil:
    visible: { id: "screen.monthly" }
    timeout: 5000
- assertVisible: "950,00"

- runFlow:
    file: .maestro/subflows/change_month.yaml
    env:
      direction: "PREVIOUS"
- assertVisible: "820,00"
- assertNotVisible: "950,00"

# ==========================================
# SCÉNARIO 3 : Portée 'FUTURE' (Troncature)
# ==========================================
- launchApp:
    clearState: true

- runFlow: .maestro/subflows/open_monthly_history.yaml

- evalScript: |
    console.log("--- CAS 3 : Portée FUTURE (Loyer Structure) ---")

- tapOn: "Loyer"
- tapOn: { id: "transaction.detail.edit" }
- tapOn: "Cette occurrence et les suivantes"

- extendedWaitUntil:
    visible: { id: "common.btn.save" }
    timeout: 5000

# VÉRIFICATION PRÉ-REMPLISSAGE RÉCURRENCE (EXHAUSTIF)
- scrollUntilVisible:
    element: { id: "transaction.edit.block.recurrence" }

- assertVisible: "Dépense ✅"
# L'ID de fréquence du Seeder pour Loyer est MONTHLY -> tx_repeat_monthly -> "Tous les mois"
- assertVisible: "Tous les mois ✅"

- tapOn: { id: "transaction.edit.btn.advanced" }
- assertVisible:
    id: "transaction.edit.field.interval"
    text: "1"

# Modifier Titre pour le futur
- tapOn: { id: "transaction.edit.field.title" }
- eraseText
- inputText: "Loyer Paris"
- tapOn: { id: "common.btn.save" }

# Vérification Troncature
- extendedWaitUntil:
    visible: { id: "screen.monthly" }
    timeout: 5000
- assertVisible: "Loyer Paris"

- runFlow:
    file: .maestro/subflows/change_month.yaml
    env:
      direction: "PREVIOUS"
- assertVisible: "Loyer"
- assertNotVisible: "Loyer Paris"

# ==========================================
# SCÉNARIO 4 : Portée 'ALL' (Global)
# ==========================================
- launchApp:
    clearState: true

- runFlow: .maestro/subflows/open_monthly_history.yaml

- evalScript: |
    console.log("--- CAS 4 : Portée ALL (Loyer Global) ---")

- tapOn: "Loyer"
- tapOn: { id: "transaction.detail.edit" }
- tapOn: "Toute la série"

- extendedWaitUntil:
    visible: { id: "common.btn.save" }
    timeout: 5000

- assertVisible: "Dépense ✅"
- assertVisible: "Tous les mois ✅"

# Modifier globalement
- tapOn: { id: "transaction.edit.field.title" }
- eraseText
- inputText: "Loyer Total"
- tapOn: { id: "common.btn.save" }

# Vérifier propagation partout
- extendedWaitUntil:
    visible: { id: "screen.monthly" }
    timeout: 5000
- assertVisible: "Loyer Total"

- runFlow:
    file: .maestro/subflows/change_month.yaml
    env:
      direction: "PREVIOUS"
- assertVisible: "Loyer Total"
