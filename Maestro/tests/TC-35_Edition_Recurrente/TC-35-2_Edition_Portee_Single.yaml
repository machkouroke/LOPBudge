appId: com.lop.budget
name: "TC-35-2: Édition Portée SINGLE"
tags:
  - edition
  - recurrence
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

- evalScript: |
    console.log("--- CAS 2 : Portée SINGLE (Loyer) ---")

- runFlow:
    file: ../../.maestro/subflows/navigate_to_edit.yaml
    env:
      transactionName: "Loyer"
      scopeSelection: "Cette occurrence uniquement"

- extendedWaitUntil:
    visible: { id: "common.btn.save" }
    timeout: 5000

# VÉRIFICATION EXHAUSTIVE
- runFlow:
    file: ../../.maestro/subflows/assert_edit_form_prefilled.yaml
    env:
      title: "Loyer"
      amount: "820.0"
      category: "Loyer"
      account: "Compte courant"

# Vérifier que le bloc récurrence est MASQUÉ (car portée SINGLE)
- repeat:
    times: 3
    commands:
      - scroll
- assertNotVisible: { id: "transaction.edit.block.recurrence" }

- scrollUntilVisible:
    element: { id: "transaction.edit.field.amount" }
    direction: UP

# Modifier montant à 950 (Input Safety)
- runFlow:
    file: ../../.maestro/subflows/update_amount.yaml
    env:
      target_id: "transaction.edit.field.amount"
      new_value: "950"

# Vérification Isolation (Scan M-1)
- extendedWaitUntil:
    visible: { id: "screen.transaction.detail" }
    timeout: 5000

# Option 3 : Séparer l'ID du Texte pour plus de robustesse
- assertVisible:
    id: "transaction.detail.field.amount"
    text: "950,00.*"

