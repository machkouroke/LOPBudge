appId: com.lop.budget
name: "TC-35-2: Portée SINGLE — seule l'occurrence ciblée change"
tags:
  - edition
  - recurrence
  - TC_35
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

- evalScript: |
    console.log("SINGLE : prefill occurrence, récurrence masquée, effet limité au mois courant")

- runFlow:
    file: ../../.maestro/subflows/navigate_to_edit.yaml
    env:
      transactionName: "Loyer"
      scopeSelection: "Cette occurrence uniquement"

# Prefill = valeurs de l'occurrence ciblée
- runFlow:
    file: ../../.maestro/subflows/assert_edit_form_prefilled.yaml
    env:
      title: "Loyer"
      amount: "820.0"
      category: "Loyer"
      account: "Compte courant"

# CA-02 : section récurrence MASQUÉE en portée SINGLE
- repeat:
    times: 3
    commands:
      - scroll
- assertNotVisible: { id: "transaction.edit.block.recurrence" }

# Modification du LIBELLÉ (observable en liste, contrairement au montant)
- scrollUntilVisible:
    element: { id: "transaction.edit.field.title" }
    direction: UP
- runFlow:
    file: ../../.maestro/subflows/update_amount.yaml
    env:
      target_id: "transaction.edit.field.title"
      new_value: "Loyer modifié"

- extendedWaitUntil:
    visible: { id: "screen.transaction.detail" }
    timeout: 5000
- assertVisible: "Loyer modifié"


# Mois suivant : occurrence INCHANGÉE
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.NEXT_MONTH_NAME}
      year: ${output.NEXT_YEAR}
- scrollUntilVisible:
    element: "Loyer"
    direction: DOWN
- scroll
- assertNotVisible: "Loyer modifié"

# Mois précédent : occurrence INCHANGÉE (la série démarre au 1er du mois précédent)
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.PREV_MONTH_NAME}
      year: ${output.PREV_YEAR}
- scrollUntilVisible:
    element: "Loyer"
    direction: DOWN
- scroll
- assertNotVisible: "Loyer modifié"