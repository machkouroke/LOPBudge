appId: com.lop.budget
name: "TC-35-1: Édition ponctuelle sans choix de portée"
tags:
  - edition
  - TC_35
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

- evalScript: |
    console.log("Scénario ponctuel : pas de bottom sheet, prefill, rename, isolation")

- tapOn: "Courses Hebdomadaires"
- assertVisible: { id: "screen.transaction.detail" }
- tapOn: { id: "transaction.detail.edit" }

# CA-01 : accès direct, AUCUNE bottom sheet de portée
- assertNotVisible: "Cette transaction fait partie d'une série récurrente."
- assertVisible: { id: "screen.transaction.edit" }

# Prefill exhaustif (data-binding)
- runFlow:
    file: ../../.maestro/subflows/assert_edit_form_prefilled.yaml
    env:
      title: "Courses Hebdomadaires"
      amount: "84.2"
      category: "Courses"
      account: "Compte courant"

# CA-02 : section récurrence MASQUÉE en portée SINGLE
- repeat:
    times: 3
    commands:
      - scroll
- assertNotVisible: { id: "transaction.edit.block.recurrence" }

# Modification du libellé + sauvegarde
- scrollUntilVisible:
    element: { id: "transaction.edit.field.amount" }
    direction: UP
- runFlow:
    file: ../../.maestro/subflows/update_amount.yaml
    env:
      target_id: "transaction.edit.field.title"
      new_value: "Courses modified"

- extendedWaitUntil:
    visible: { id: "screen.transaction.detail" }
    timeout: 5000
- assertVisible: "Courses modified"
- assertNotVisible: "Courses Hebdomadaires"

