appId: com.lop.budget
name: "TC-35-1: Édition Transaction Normale"
tags:
  - edition
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

- evalScript: |
    console.log("--- CAS 1 : Transaction ponctuelle (Courses Hebdomadaires) ---")

- tapOn: "Courses Hebdomadaires"
- assertVisible: { id: "screen.transaction.detail" }
- tapOn: { id: "transaction.detail.edit" }

# Vérifier accès direct (Pas de BottomSheet)
- assertVisible: { id: "screen.transaction.edit" }

# VÉRIFICATION EXHAUSTIVE PRÉ-REMPLISSAGE (Data-Binding)
- runFlow:
    file: ../../.maestro/subflows/assert_edit_form_prefilled.yaml
    env:
      title: "Courses Hebdomadaires"
      amount: "84.2"
      category: "Courses"
      account: "Compte courant"

# Vérifier que le bloc récurrence est MASQUÉ (car ponctuel)
- scrollUntilVisible:
    element: { id: "transaction.edit.block.recurrence" }
- assertVisible: "Ne se répète pas"

- scrollUntilVisible:
    element: { id: "transaction.edit.field.title" }
    direction: UP

# Modifier et enregistrer
- runFlow:
    file: ../../.maestro/subflows/update_amount.yaml
    env:
      target_id: "transaction.edit.field.title"
      new_value: "Courses Hebdo"

# Vérifier retour et modification effective
- extendedWaitUntil:
    visible: { id: "screen.transaction.detail" }
    timeout: 5000
- assertVisible: "Courses Hebdo"
