appId: com.lop.budget
name: "TC-35-3 - Portee FUTURE - occurrence ciblee et suivantes, passe intact"
tags:
  - edition
  - recurrence
  - TC_35
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

- evalScript: |
    console.log("FUTURE : prefill occurrence, récurrence visible, effet M et M+1, M-1 intact, zéro doublon")

- runFlow:
    file: ../../.maestro/subflows/navigate_to_edit.yaml
    env:
      transactionName: "Loyer"
      scopeSelection: "Cette occurrence et les suivantes"

# Prefill = valeurs de l'occurrence ciblée
- runFlow:
    file: ../../.maestro/subflows/assert_edit_form_prefilled.yaml
    env:
      title: "Loyer"
      amount: "820.0"
      category: "Loyer"
      account: "Compte courant"

# Section récurrence VISIBLE et préremplie depuis la série
- scrollUntilVisible:
    element: { id: "transaction.edit.block.recurrence" }
# Le champ de fréquence est centré avant l'assertion. Sans centrage, scrollUntilVisible s'arrêtait
# dès que le bord haut du bloc récurrence entrait à l'écran : Maestro mesure le bloc découpé par le
# bas de l'écran et le juge visible à 100 %, alors que « Tous les mois » reste dessous. Depuis
# f5ff2bd la liste défile aussi sous le bouton Enregistrer. Échec intermittent en CI le 22/09/2026.
- scrollUntilVisible:
    element: { id: "transaction.edit.field.frequency" }
    centerElement: true
- assertVisible: "Tous les mois"
- tapOn: { id: "transaction.edit.btn.advanced" }
- scrollUntilVisible:
    element: "occurrences"
- assertVisible:
    id: "transaction.edit.field.interval"
    text: "1"


- repeat:
    times: 3
    commands:
      - swipe:
          direction: DOWN
- scrollUntilVisible:
    element: { id: "transaction.edit.field.title" }
    direction: UP
- runFlow:
    file: ../../.maestro/subflows/update_amount.yaml
    env:
      target_id: "transaction.edit.field.title"
      new_value: "Loyer updated"

- extendedWaitUntil:
    visible: { id: "screen.transaction.detail" }
    timeout: 5000
- assertVisible: "Loyer updated"

# Mois suivant : modifié, PAS de doublon ancienne série + nouvelle série
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.NEXT_MONTH_NAME}
      year: ${output.NEXT_YEAR}
- scrollUntilVisible:
    element: "Loyer updated"
    direction: DOWN
- scroll
- assertNotVisible: "Loyer"

# Mois précédent : INTACT
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.PREV_MONTH_NAME}
      year: ${output.PREV_YEAR}
- scrollUntilVisible:
    element: "Loyer"
    direction: DOWN
- scroll
- assertNotVisible: "Loyer updated"