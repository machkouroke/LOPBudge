appId: com.lop.budget
name: "TC-109-1 - Notification de paiement -> proposition detectee"
tags:
  - tc-109
  - detection
---
# =====================================================================================
# TC-109-1 — Une notification de paiement produit une proposition
# -------------------------------------------------------------------------------------
# Niveau        : E2E / UI (Maestro). Parcours visible uniquement.
# US            : LOP-54 — Détection de transaction via les notifications
# Chaîne        : adb `cmd notification post` -> LopNotificationListenerService
#                 -> HandlePaymentNotificationUseCase -> ShellNotificationParser
#                 -> proposition en base -> compteur d'en-tête -> boîte de réception
#
# étape -> CA / invariant :
#   1  -> I-5    la détection est inactive par défaut, on l'active explicitement
#   2  -> CA-25  l'instantané est injecté sans émulateur ni paiement réel
#   3  -> CA-06  la notification produit une proposition, visible au nom du commerçant
#
# Ce que ce flow ne prouve **pas**, volontairement :
#   - la valeur exacte des champs (montant, devise, carte, clé) : TC-108 les assert au caractère
#     près en unitaire, les redériver ici depuis l'écran donnerait un oracle plus faible ;
#   - CA-07 « libellé sans montant ni carte » : la carte de la boîte de réception affiche aussi le
#     nom de carte, le montant **et le texte brut** de la notification. Un `assertNotVisible` sur le
#     montant serait donc faux : ces éléments sont légitimement à l'écran. Isoler le libellé
#     demanderait un `testTag` sur son `Text`, qui n'existe pas ;
#   - CA-15 le compteur d'en-tête : le badge est un `Text` imbriqué dans un `Surface`, et le
#     sélecteur combiné texte + testTag du bouton ne matche pas. Le cibler seul par son texte
#     serait ambigu (l'accueil est plein de « 1 »). À porter par un scénario dédié, après avoir
#     ajouté un `testTag` stable sur le badge.
#
# Pourquoi une passerelle HTTP (montage « D ») :
#   Maestro 2.8.0 n'a aucune commande shell, et son moteur JS est en bac à sable —
#   sonde du 14/09/2026 : `java:undefined  http:object  proc:undefined`. Sans `Java`,
#   pas de `Runtime.exec`, donc pas d'adb depuis un `runScript`. Seul `http` est exposé.
#   La passerelle tourne sur la machine hôte, là où adb est déjà installé.
#
# Préconditions, hors flow :
#   1. build debug installée — `ShellNotificationParser` n'est inscrit que si BuildConfig.DEBUG
#   2. passerelle démarrée :
#        python3 scripts/adb_notification_bridge.py   (Linux/CI)
#        python  scripts/adb_notification_bridge.py   (Windows)
#
# L'autorisation d'écoute n'est PAS une précondition manuelle : la passerelle l'accorde elle-même
# avant de poster, de façon idempotente. Ce n'est pas un confort, c'est **obligatoire** — mesuré le
# 14/09/2026 : `clearState` (pm clear) **révoque** l'autorisation d'écoute. Elle est donc à rétablir
# à chaque exécution du flow, juste après la première étape.
#
# Et c'est ce qui rend ce flow portable : l'accorder par l'UI obligerait à taper « Autoriser
# l'accès aux notifications » puis à piloter l'écran système « Accès aux notifications » — une
# liste d'applications dont la mise en page, l'ordre et les libellés changent entre One UI, un
# Pixel et un émulateur. Par adb, la commande est la même partout.
#
# Trois mesures faites sur SM-S938B / Android 16, encodées dans la passerelle :
#   - `clearState` révoque l'autorisation d'écoute ;
#   - l'écriture du réglage est asynchrone (1 à 2 s), une relecture immédiate ment ;
#   - le réglage accordé ne suffit pas, Android doit encore **lier** le service (< 1 s) : poster
#     avant la liaison perdrait la notification en silence.
#
# L'écran de réglages de LOPBudge ne reflète jamais l'état réel de l'autorisation — le bouton
# « Autoriser l'accès » est affiché inconditionnellement — donc l'UI ne peut pas servir d'oracle
# sur ce point. Écart vis-à-vis de CA-02 et CA-03, à ouvrir en anomalie.
#
# Hors périmètre (ne pas ajouter ici) :
#   - L'analyse du texte (montant, libellé, carte, clé) : portée par TC-108, en unitaire.
#   - Le regroupement anti-doublon et la fenêtre de 2 minutes (CA-12, CA-13).
#   - L'acceptation, le refus et le formulaire pré-rempli (CA-16 à CA-19).
#   - Le rejet d'une source non autorisée (CA-05) : ici la source est autorisée en debug.
#
# ⚠️ `clearState: true` efface les données de LOPBudge sur l'appareil branché.
#    À ne lancer que sur un appareil de test.
# =====================================================================================
# Ce texte est une base pour les futures test ui relatif à la détection de notifications ce n'est donc pas un test planifié ne pas le calculer pour le moment

# Given l'application démarre d'un état propre
- launchApp:
    clearState: true
- assertVisible:
    id: "screen.home"

# Given la détection est activée (I-5 : elle est inactive par défaut)
- tapOn:
    id: "nav.settings.button"
- tapOn:
    id: "settings.switch.notif_detection"
- back
- assertVisible:
    id: "screen.home"

# When une notification de paiement arrive réellement sur l'appareil (CA-25)
- runScript:
    file: ../../scripts/post_notification.js
    env:
      NOTIF_TITLE: "MG ORGANISATION"
      NOTIF_TEXT: "6,50 € avec la carte Curve Card ••6088"
      NOTIF_TAG: "TC109"

# `post_notification.js` lève une exception détaillée si la passerelle est éteinte ou refuse de
# poster — pas besoin d'assertion ici, et le message est lisible directement dans le rapport.

# Then on part directement dans la boîte de réception
- tapOn:
    id: "nav.detected.button"
- assertVisible:
    id: "screen.detected"

# Then la proposition détectée y apparaît, au nom du commerçant (CA-06)
#
# L'attente est ici, et pas avant le tap : entre la notification système et l'écriture en base il
# s'écoule un délai variable, et l'écran observe la table. On peut donc ouvrir la boîte vide et
# laisser la ligne arriver toute seule, ce qui évite d'attendre sur un élément de l'accueil.
- extendedWaitUntil:
    visible: "MG ORGANISATION"
    timeout: 20000
