appId: com.lop.budget
name: "TC-40-2: Marquage payé via popup long press"
tags:
  - recurrence
  - payment
  - edition
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

- evalScript: |
    console.log("Given une occurrence de la série récurrente 'Loyer' est visible sur le mois courant")
- assertVisible: "Loyer"

- evalScript: |
    console.log("When l’utilisateur déclenche le marquage payé depuis 'bouton Payer du popup d’appui long'")
- longPressOn: "Loyer"
- assertVisible: "Payer"
- tapOn: "Payer"

- evalScript: |
    console.log("Then aucune bottom sheet de choix de portée n’est affichée")
- assertNotVisible: "Modifier la transaction ?"

- evalScript: |
    console.log("And l’occurrence ciblée affiche le statut payé")
- tapOn: "Loyer"
- scrollUntilVisible:
    element: "Marquer comme non payé"
    direction: DOWN


- evalScript: |
    console.log("And l’icône de série récurrente est toujours visible dans le bloc Loyer")
- scrollUntilVisible:
    element: { id: "transaction.detail.edit" }
    direction: UP
- tapOn: { id: "common.btn.back" }
- assertVisible:
    text: "Récurrent"
    rightOf: "Loyer"
