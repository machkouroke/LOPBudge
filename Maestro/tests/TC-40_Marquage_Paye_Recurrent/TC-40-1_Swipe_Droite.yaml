appId: com.lop.budget
name: "TC-40-1: Marquage payé via swipe droite"
tags:
  - recurrence
  - payment
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

- evalScript: |
    console.log("Given une occurrence de la série récurrente 'Loyer' est visible sur le mois courant")
- assertVisible: "Loyer"

- evalScript: |
    console.log("When l’utilisateur déclenche le marquage payé depuis 'swipe droite'")
- swipe:
    from:
      text: "Loyer"
    direction: RIGHT
    duration: 500

- evalScript: |
    console.log("Then aucune bottom sheet de choix de portée n’est affichée")
- assertNotVisible: "Modifier la transaction ?"

- evalScript: |
    console.log("And l’occurrence ciblée affiche le statut payé")
- tapOn: "Loyer"
- scrollUntilVisible:
    element: "Marquer comme non payé"
    direction: DOWN

- evalScript: |
    console.log("And l’icône de série récurrente est toujours visible dans le bloc Loyer")
- scrollUntilVisible:
    element: { id: "transaction.detail.edit" }
    direction: UP
- tapOn: { id: "common.btn.back" }
- assertVisible:
    text: "Récurrent"
    rightOf: "Loyer"

- evalScript: |
    console.log("And les autres occurrences de la série restent inchangées (mois précédent)")
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.PREV_MONTH_NAME}
      year: ${output.PREV_YEAR}
- assertVisible: "Loyer"
- assertVisible:
    text: "Récurrent"
    rightOf: "Loyer"
- tapOn: "Loyer"
- scrollUntilVisible:
    element: "Marquer comme payé"
    direction: DOWN
- tapOn: { id: "common.btn.back" }

- evalScript: |
    console.log("And les autres occurrences de la série restent inchangées (mois suivant)")
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.NEXT_MONTH_NAME}
      year: ${output.NEXT_YEAR}
- assertVisible: "Loyer"
- assertVisible:
    text: "Récurrent"
    rightOf: "Loyer"
- tapOn: "Loyer"
- scrollUntilVisible:
    element: "Marquer comme payé"
    direction: DOWN

- tapOn: { id: "common.btn.back" }

- evalScript: |
    console.log("Revenir au mois courant pour la suite du test")
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.CURRENT_MONTH_NAME}
      year: ${output.CURRENT_YEAR}

- evalScript: |
    console.log("When l’utilisateur ouvre l’édition de cette occurrence")
- tapOn: "Loyer"
- scrollUntilVisible:
    element: { id: "transaction.detail.edit" }
    direction: UP
- tapOn: { id: "transaction.detail.edit" }

- evalScript: |
    console.log("Then la bottom sheet de choix de portée d’édition est toujours affichée")
- assertVisible: "Modifier la transaction ?"
- assertVisible: "Cette occurrence uniquement"
- assertVisible: "Cette occurrence et les suivantes"
- assertVisible: "Toute la série"

- evalScript: |
    console.log("When l’utilisateur annule l’édition")
- tapOn: "Annuler"

- evalScript: |
    console.log("And il déclenche à nouveau le marquage payé depuis 'swipe droite'")
- tapOn: { id: "common.btn.back" } # Sortir du détail
- swipe:
    from:
      text: "Loyer"
    direction: RIGHT
    duration: 500

- evalScript: |
    console.log("Then l’occurrence ciblée repasse au statut planifié")
- tapOn: "Loyer"
- scrollUntilVisible:
    element: "Marquer comme payé"
    direction: DOWN
- assertVisible: "Marquer comme payé"
