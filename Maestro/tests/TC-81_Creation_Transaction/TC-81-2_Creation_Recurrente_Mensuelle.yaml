appId: com.lop.budget
name: "TC-81-2 - Création récurrente mensuelle, occurrence virtuelle, pas de doublon"
tags:
  - tc-81
  - creation
---
# =====================================================================================
# TC-81-2 — Création récurrente mensuelle : occurrence virtuelle, pas de doublon
# -------------------------------------------------------------------------------------
# Niveau        : E2E / UI (Maestro). Parcours visible uniquement.
# US            : LOP-2 — Création de transaction : formulaire d'ajout + écriture en base
# Ticket        : TC-81
# Chaîne        : + (nav.add.button) -> AddActionSheet -> TransactionEditScreen (mode ajout)
#                 -> CreateTransactionUseCase (branche série) -> liste mois courant
#                 -> liste mois suivant (occurrence générée par RecurrenceEngine)
#
# cas -> CA / invariant :
#   étape 4  -> CA-07 / I-4  la série est visible une seule fois sur le mois courant
#   étape 5  -> CA-07 / I-4  occurrence VIRTUELLE sur le mois suivant, sans doublon
#   étape 6  -> isolation    aucune fuite depuis TC-81-1
#
# Écarts spec/code assumés :
#   - La création récurrente retourne un id VIRTUEL NÉGATIF
#     (RecurrenceEngine.calculateVirtualId). Le garde `newId > 0` de LopNavHost échoue
#     donc volontairement et la navigation fait popBackStack() : on revient sur Home,
#     et non sur un écran de détail. C'est le comportement attendu (une occurrence
#     virtuelle n'a pas de ligne à afficher).
#   - Le sélecteur de catégorie s'ouvre automatiquement en mode ajout.
#
# Ancrage sur output.SAFE_ANCHOR_DAY du mois courant (15, ou 22 du 14 au 16), jamais
#   sur aujourd'hui : un jour 29, 30 ou 31 absent d'un mois à venir ouvre, à
#   l'enregistrement, la feuille « Ce jour n'existe pas à chaque fois » (LOP-88).
#   Ancré sur aujourd'hui, ce flow échouait donc chaque 29, 30 et 31 (CI du
#   29 octobre 2026). Cette feuille relève de TC-141, pas de ce flow.
#
# Hors périmètre (ne pas ajouter ici) :
#   - Absence de matérialisation en base (0 ligne transaction) : porté par TC-83.
#   - Statut / toggle payé masqué en récurrent (I-6) : hors ticket.
#   - Anti double-soumission (CA-10) : flaky en Maestro, porté au niveau ViewModel.
# =====================================================================================

# Given l'application est ouverte, état propre (clearState)
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml
- runFlow: ../../.maestro/subflows/go_to_home.yaml

- evalScript: |
    console.log("TC-81-2 : création d'une série mensuelle ancrée le " + output.SAFE_ANCHOR_DAY + " " + output.CURRENT_MONTH_FULL_NAME)

# When l'utilisateur ouvre l'ajout via + puis Dépense
- tapOn: { id: "nav.add.button" }
- assertVisible: { id: "add.action.sheet" }
- tapOn: { id: "add.action.expense" }

# And il saisit une catégorie dépense — sélection PAR LA RECHERCHE
# En mode recherche le tap sélectionne directement, ce qui court-circuite le
# drill-down et sa section « Sélectionner la catégorie principale » / « Sous-catégories ».
- assertVisible: "Choisir une catégorie"
- tapOn: "Chercher une catégorie..."
- inputText: "Pharmacie"
- hideKeyboard
# index 1 car index 0 est le champ de recherche, qui contient désormais le même texte.
- tapOn:
    text: "Pharmacie"
    index: 1

- assertVisible: { id: "screen.transaction.edit" }

# And il saisit le titre et le montant
- tapOn: { id: "transaction.edit.field.title" }
- inputText: "TC-create-recurrent"
- hideKeyboard

- tapOn: { id: "transaction.edit.field.amount" }
- inputText: "12.34"
- hideKeyboard

# And il fixe la date au jour d'ancrage du mois courant (voir l'en-tête)
- scrollUntilVisible:
    element:
      id: "transaction.edit.field.date"
    direction: DOWN
- tapOn: { id: "transaction.edit.field.date" }
- assertVisible: { id: "picker.date" }
# Libellé d'une case du calendrier Material : « Jeudi 15 octobre 2026 ». Le mois affiché
# est celui de la date du formulaire, aujourd'hui.
- tapOn: ".* ${output.SAFE_ANCHOR_DAY} ${output.CURRENT_MONTH_FULL_NAME} ${output.CURRENT_YEAR}.*"
- tapOn: "OK"
- assertNotVisible: { id: "picker.date" }
# Le champ affiche la date choisie : sans cela, l'ancrage resterait aujourd'hui.
- assertVisible: ".* ${output.SAFE_ANCHOR_DAY} ${output.CURRENT_MONTH_FULL_NAME} ${output.CURRENT_YEAR}.*"

# And il choisit une récurrence Tous les mois (ancrage = date du formulaire)
- scrollUntilVisible:
    element:
      id: "transaction.edit.field.frequency"
    direction: DOWN
- tapOn: { id: "transaction.edit.field.frequency" }
- tapOn: "Tous les mois"
- assertVisible: "Tous les mois"

# And il remonte et le champ marqué comme payé disparaît (Mise à jour 03/09/26)
- scrollUntilVisible:
    element:
      id: "transaction.edit.field.title"
    direction: UP
- assertNotVisible: { id: "transaction.detail.toggle.paid" }

# And il sauvegarde
- tapOn: { id: "common.btn.save" }

# Then il n'est plus sur l'écran d'édition — retour Home (id virtuel négatif)
- assertNotVisible: { id: "screen.transaction.edit" }
- assertVisible: { id: "home.month.picker" }

- evalScript: |
    console.log("TC-81-2 : série créée, retour Home (id virtuel) — contrôle du mois courant")

# Then "TC-create-recurrent" est visible une seule fois sur le mois courant (CA-07)
- runFlow: ../../.maestro/subflows/open_monthly_history.yaml
- scrollUntilVisible:
    element:
      text: "TC-create-recurrent"
    direction: DOWN
- assertVisible: "TC-create-recurrent"
- assertNotVisible:
    text: "TC-create-recurrent"
    index: 1

# When il passe au mois suivant
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.NEXT_MONTH_NAME}
      year: ${output.NEXT_YEAR}

- evalScript: |
    console.log("TC-81-2 : mois suivant = " + output.NEXT_MONTH_NAME + " " + output.NEXT_YEAR)

# Then "TC-create-recurrent" est visible une seule fois (occurrence virtuelle) (CA-07 / I-4)
# And aucun doublon
- scrollUntilVisible:
    element:
      text: "TC-create-recurrent"
    direction: DOWN
- assertVisible: "TC-create-recurrent"
- assertNotVisible:
    text: "TC-create-recurrent"
    index: 1

- evalScript: |
    console.log("TC-81-2 : CA-07 vérifié — occurrence virtuelle unique sur le mois suivant")

# Contrôle d'isolation : ce flow est indépendant, la ponctuelle de TC-81-1 n'existe pas
- assertNotVisible: "TC-create-ponctuel"
