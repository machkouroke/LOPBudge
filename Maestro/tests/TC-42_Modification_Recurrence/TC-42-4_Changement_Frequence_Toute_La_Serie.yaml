appId: com.lop.budget
name: "TC-42-4: Changer la fréquence pour toute la série"
tags:
  - recurrence
  - edition
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

- evalScript: |
    console.log("Scenario: Changer la fréquence pour toute la série")

# Given l'utilisateur ouvre l'édition de l'occurrence "Loyer" du mois courant
# And il sélectionne la portée "Toute la série"
- runFlow:
    file: ../../.maestro/subflows/navigate_to_edit.yaml
    env:
      transactionName: "Loyer"
      scopeSelection: "Toute la série"

# Then la section de récurrence affiche la fréquence "Mensuel"
- scrollUntilVisible:
    element: { id: "transaction.edit.field.frequency" }
    direction: DOWN
- assertVisible: "Mensuel"

# When il remplace la fréquence par "{nouvelleFrequence}" (Hebdomadaire)
- runFlow:
    file: ../../.maestro/subflows/update_recurrence_frequency.yaml
    env:
      frequency: "Hebdomadaire"

# And il enregistre
- tapOn: { id: "common.btn.save" }

# RETOUR SUR L'ÉCRAN DE DÉTAIL
- assertVisible: { id: "screen.transaction.detail" }

# APPUI BOUTON RETOUR -> RETOUR ÉCRAN DU MOIS
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.monthly" }

# Then plusieurs occurrences "Loyer" sont affichées sur le mois courant
# On vérifie la présence de deux éléments distincts
- assertVisible:
    text: "Loyer"
    index: 0
- assertVisible:
    text: "Loyer"
    index: 1

# And chaque occurrence porte l'icône de série récurrente
- assertVisible: { id: "Repeat" }

# RETOUR ACCUEIL -> MOIS PRÉCÉDENT
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.home" }

# And le mois précédent affiche également des occurrences selon la nouvelle fréquence
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.PREV_MONTH_NAME}
      year: ${output.PREV_YEAR}
- assertVisible:
    text: "Loyer"
    index: 0
- assertVisible:
    text: "Loyer"
    index: 1
