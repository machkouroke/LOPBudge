appId: com.lop.budget
name: "TC-42-5: Changer la fréquence pour les occurrences suivantes uniquement"
tags:
  - recurrence
  - edition
  - wip
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

- evalScript: |
    console.log("Scenario: Changer la fréquence pour les occurrences suivantes uniquement")

# Given l'utilisateur ouvre l'édition de l'occurrence "Loyer" du mois courant
# And il sélectionne la portée "Cette occurrence et les suivantes"
- runFlow:
    file: ../../.maestro/subflows/navigate_to_edit.yaml
    env:
      transactionName: "Loyer"
      scopeSelection: "Cette occurrence et les suivantes"

# When il remplace la fréquence par "{nouvelleFrequence}" (Hebdomadaire)
- runFlow:
    file: ../../.maestro/subflows/update_recurrence_frequency.yaml
    env:
      frequency: "Hebdomadaire"

# And il enregistre
- tapOn: { id: "common.btn.save" }

# RETOUR SUR L'ÉCRAN DE DÉTAIL
- assertVisible: { id: "screen.transaction.detail" }

# APPUI BOUTON RETOUR -> RETOUR ÉCRAN DU MOIS
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.monthly" }

# Then le mois courant affiche les occurrences selon la nouvelle fréquence (au moins 2)
- assertVisible:
    text: "Loyer"
    index: 0
- assertVisible:
    text: "Loyer"
    index: 1

# RETOUR ACCUEIL -> MOIS SUIVANT
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.home" }

# And le mois suivant affiche les occurrences selon la nouvelle fréquence
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.NEXT_MONTH_NAME}
      year: ${output.NEXT_YEAR}
- assertVisible:
    text: "Loyer"
    index: 0
- assertVisible:
    text: "Loyer"
    index: 1

# RETOUR ACCUEIL -> MOIS PRÉCÉDENT
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.home" }

# And le mois précédent affiche encore une seule occurrence "Loyer" à sa date d'origine
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.PREV_MONTH_NAME}
      year: ${output.PREV_YEAR}
- scrollUntilVisible:
    element: "1 ${output.PREV_MONTH_NAME}.*"
    direction: DOWN
- assertVisible:
    text: "Loyer"
    below: "1 ${output.PREV_MONTH_NAME}.*"
- assertNotVisible:
    text: "Loyer"
    index: 1
