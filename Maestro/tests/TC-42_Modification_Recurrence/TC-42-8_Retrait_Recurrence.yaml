appId: com.lop.budget
name: "TC-42-8: Retirer la récurrence à partir de l'occurrence consultée"
tags:
  - recurrence
  - edition
  - wip
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

- evalScript: |
    console.log("Scenario: Retirer la récurrence à partir de l'occurrence consultée")

# Given l'utilisateur ouvre l'édition de l'occurrence "Loyer" du mois courant
# And il sélectionne la portée "Cette occurrence et les suivantes"
- runFlow:
    file: ../../.maestro/subflows/navigate_to_edit.yaml
    env:
      transactionName: "Loyer"
      scopeSelection: "Cette occurrence et les suivantes"

# When il désactive la récurrence
- scrollUntilVisible:
    element: { id: "transaction.edit.field.frequency" }
    direction: DOWN

- tapOn: { id: "transaction.edit.field.frequency" }
- tapOn: "Aucune"

# And il enregistre
- tapOn: { id: "common.btn.save" }

# RETOUR SUR L'ÉCRAN DE DÉTAIL
- assertVisible: { id: "screen.transaction.detail" }

# APPUI BOUTON RETOUR -> RETOUR ÉCRAN DU MOIS
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.monthly" }

# Then l'occurrence "Loyer" du mois courant est affichée sans icône de série récurrente
- scrollUntilVisible:
    element: "1 ${output.CURRENT_MONTH_NAME.substring(0, 3)}.*"
    direction: DOWN
- assertVisible: "Loyer"
- assertNotVisible:
    id: "Repeat"
    below: "1 ${output.CURRENT_MONTH_NAME.substring(0, 3)}.*"

# RETOUR ACCUEIL -> MOIS SUIVANT
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.home" }

# And aucune occurrence "Loyer" n'est affichée sur le mois suivant
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.NEXT_MONTH_NAME}
      year: ${output.NEXT_YEAR}
- assertVisible: { id: "screen.monthly" }
- assertNotVisible: "Loyer"

# RETOUR ACCUEIL -> MOIS PRÉCÉDENT
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.home" }

# And l'occurrence "Loyer" du mois précédent est toujours affichée avec son icône de série
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.PREV_MONTH_NAME}
      year: ${output.PREV_YEAR}
- scrollUntilVisible:
    element: "1 ${output.PREV_MONTH_NAME.substring(0, 3)}.*"
    direction: DOWN
- assertVisible:
    text: "Loyer"
    below: "1 ${output.PREV_MONTH_NAME.substring(0, 3)}.*"
- assertVisible:
    id: "Repeat"
    below: "1 ${output.PREV_MONTH_NAME.substring(0, 3)}.*"

# RETOUR ACCUEIL -> MOIS COURANT (Pour vérification finale BottomSheet)
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.home" }

- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.CURRENT_MONTH_NAME}
      year: ${output.CURRENT_YEAR}

# When l'utilisateur ouvre le détail de l'occurrence du mois courant et choisit de la modifier
- tapOn: "Loyer"
- assertVisible: { id: "screen.transaction.detail" }
- tapOn: { id: "transaction.detail.edit" }

# Then aucune bottom sheet de choix de portée n'est affichée (car ce n'est plus une série)
- assertNotVisible: "Modifier la transaction ?"
- assertVisible: { id: "screen.transaction.edit" }
