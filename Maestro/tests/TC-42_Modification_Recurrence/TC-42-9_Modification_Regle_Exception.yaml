appId: com.lop.budget
name: "TC-42-9: Une modification de règle ne supprime pas silencieusement une exception"
tags:
  - recurrence
  - edition
  - wip
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

- evalScript: |
    console.log("Scenario: Une modification de règle ne supprime pas silencieusement une exception")

# Given une occurrence future de la série "Loyer" a déjà été modifiée individuellement
# 1. Aller au mois suivant
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.NEXT_MONTH_NAME}
      year: ${output.NEXT_YEAR}

# 2. Créer l'exception (Montant 999)
- runFlow:
    file: ../../.maestro/subflows/navigate_to_edit.yaml
    env:
      transactionName: "Loyer"
      scopeSelection: "Cette occurrence uniquement"

- runFlow:
    file: ../../.maestro/subflows/update_amount.yaml
    env:
      target_id: "transaction.edit.field.amount"
      new_value: "999"

# 3. Retourner à l'historique puis à l'accueil
- assertVisible: { id: "screen.transaction.detail" }
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.monthly" }
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.home" }

# And l'utilisateur ouvre l'édition de l'occurrence "Loyer" du mois courant
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.CURRENT_MONTH_NAME}
      year: ${output.CURRENT_YEAR}

# And il sélectionne la portée "Toute la série"
- runFlow:
    file: ../../.maestro/subflows/navigate_to_edit.yaml
    env:
      transactionName: "Loyer"
      scopeSelection: "Toute la série"

# When il remplace la fréquence par "{nouvelleFrequence}" (Hebdomadaire)
- runFlow:
    file: ../../.maestro/subflows/update_recurrence_frequency.yaml
    env:
      frequency: "Hebdomadaire"

# And il enregistre
- tapOn: { id: "common.btn.save" }

# 4. Retourner à l'historique puis à l'accueil
- assertVisible: { id: "screen.transaction.detail" }
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.monthly" }
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.home" }

# Then l'occurrence modifiée individuellement reste visible
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.NEXT_MONTH_NAME}
      year: ${output.NEXT_YEAR}

# On cherche notre exception à 999
- scrollUntilVisible:
    element: "1 ${output.NEXT_MONTH_NAME}.*"
    direction: DOWN
- assertVisible:
    text: "999,00.*"
    below: "1 ${output.NEXT_MONTH_NAME}.*"
