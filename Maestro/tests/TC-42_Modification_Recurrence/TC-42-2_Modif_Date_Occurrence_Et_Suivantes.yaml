appId: com.lop.budget
name: "TC-42-2: Déplacer l'occurrence et les suivantes"
tags:
  - recurrence
  - edition
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

- evalScript: |
    console.log("Scenario: Déplacer l'occurrence et les suivantes (portée Cette occurrence et les suivantes)")

# Given l'utilisateur ouvre le détail de l'occurrence "Loyer" du mois courant
# When il choisit de la modifier
# And il sélectionne la portée "Cette occurrence et les suivantes"
- runFlow:
    file: ../../.maestro/subflows/navigate_to_edit.yaml
    env:
      transactionName: "Loyer"
      scopeSelection: "Cette occurrence et les suivantes"

# Then la section de récurrence est visible et préremplie avec la fréquence de la série
- scrollUntilVisible:
    element: { id: "transaction.edit.block.recurrence" }
    direction: DOWN
- assertVisible: "Mensuel"

- scrollUntilVisible:
    element: { id: "transaction.edit.field.date" }
    direction: UP

# When il remplace la date par {jourCible} (6)
- runFlow:
    file: ../../.maestro/subflows/update_date.yaml
    env:
      target_day: "6"

# And il enregistre
- tapOn: { id: "common.btn.save" }

# RETOUR SUR L'ÉCRAN DE DÉTAIL
- assertVisible: { id: "screen.transaction.detail" }

# APPUI BOUTON RETOUR -> RETOUR ÉCRAN DU MOIS
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.monthly" }

# VÉRIFICATION POSITIONNELLE COURANT
- scrollUntilVisible:
    element: "6 ${output.CURRENT_MONTH_NAME.substring(0, 3)}.*"
    direction: DOWN
- assertVisible:
    text: "Loyer"
    below: "6 ${output.CURRENT_MONTH_NAME.substring(0, 3)}.*"

# RETOUR ACCUEIL -> MOIS SUIVANT
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.home" }

# VÉRIFICATION MOIS SUIVANT (Déplacé au 6)
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.NEXT_MONTH_NAME}
      year: ${output.NEXT_YEAR}
- scrollUntilVisible:
    element: "6 ${output.NEXT_MONTH_NAME.substring(0, 3)}.*"
    direction: DOWN
- assertVisible:
    text: "Loyer"
    below: "6 ${output.NEXT_MONTH_NAME.substring(0, 3)}.*"

# RETOUR ACCUEIL -> MOIS PRÉCÉDENT
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.home" }

# VÉRIFICATION MOIS PRÉCÉDENT (Resté au 1er)
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.PREV_MONTH_NAME}
      year: ${output.PREV_YEAR}
- scrollUntilVisible:
    element: "1 ${output.PREV_MONTH_NAME.substring(0, 3)}.*"
    direction: DOWN
- assertVisible:
    text: "Loyer"
    below: "1 ${output.PREV_MONTH_NAME.substring(0, 3)}.*"
