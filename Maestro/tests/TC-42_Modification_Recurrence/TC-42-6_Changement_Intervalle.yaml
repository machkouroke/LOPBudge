appId: com.lop.budget
name: "TC-42-6: Changer l'intervalle de répétition"
tags:
  - recurrence
  - edition
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

- evalScript: |
    console.log("Scenario: Changer l'intervalle de répétition")

# Given l'utilisateur ouvre l'édition de l'occurrence "Loyer" du mois courant
# And il sélectionne la portée "Toute la série"
- runFlow:
    file: ../../.maestro/subflows/navigate_to_edit.yaml
    env:
      transactionName: "Loyer"
      scopeSelection: "Toute la série"

# When il remplace l'intervalle par {nouvelIntervalle} (3)
- runFlow:
    file: ../../.maestro/subflows/update_recurrence_interval.yaml
    env:
      interval: "3"

# And il enregistre
- tapOn: { id: "common.btn.save" }

# RETOUR SUR L'ÉCRAN DE DÉTAIL
- assertVisible: { id: "screen.transaction.detail" }

# APPUI BOUTON RETOUR -> RETOUR ÉCRAN DU MOIS
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.monthly" }

# Then l'occurrence "Loyer" est affichée sur le mois courant
- scrollUntilVisible:
    element: "1 ${output.CURRENT_MONTH_NAME}.*"
    direction: DOWN
- assertVisible:
    text: "Loyer"
    below: "1 ${output.CURRENT_MONTH_NAME}.*"

# RETOUR ACCUEIL -> MOIS SUIVANT
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.home" }

# And aucune occurrence "Loyer" n'est affichée sur le mois suivant (car intervalle de 3 mois)
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.NEXT_MONTH_NAME}
      year: ${output.NEXT_YEAR}
- assertVisible: { id: "screen.monthly" }
- assertNotVisible: "Loyer"
