appId: com.lop.budget
name: "TC-42-1: Déplacer uniquement l'occurrence consultée"
tags:
  - recurrence
  - edition
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

- evalScript: |
    console.log("Scenario: Déplacer uniquement l'occurrence consultée (portée Cette occurrence)")

# Background: la série récurrente "Loyer" affiche une occurrence
- assertVisible: "Loyer"

# Given l'utilisateur ouvre le détail de l'occurrence "Loyer" du mois courant
# When il choisit de la modifier
# And il sélectionne la portée "Cette occurrence"
- runFlow:
    file: ../../.maestro/subflows/navigate_to_edit.yaml
    env:
      transactionName: "Loyer"
      scopeSelection: "Cette occurrence uniquement"

# Then la section de récurrence n'est pas modifiable dans l'écran de la transaction
- repeat:
    times: 3
    commands:
      - scroll
- assertNotVisible: { id: "transaction.edit.block.recurrence" }

- scrollUntilVisible:
    element: { id: "transaction.edit.field.date" }
    direction: UP

# When il remplace la date par {jourCible}
# Note: On suppose jourOrigine est par défaut (ex: 1er) et on ajoute 5 jours -> 6
- runFlow:
    file: ../../.maestro/subflows/update_date.yaml
    env:
      target_day: "06"
      target_month: ${output.CURRENT_MONTH_NUM}
      target_year: ${output.CURRENT_YEAR}

# And il enregistre
- tapOn: { id: "common.btn.save" }

# RETOUR SUR L'ÉCRAN DE DÉTAIL (Automatique après save)
- assertVisible: { id: "screen.transaction.detail" }
# Vérification de la date sur le détail (Format: "Mardi 6 Août 2024")
- assertVisible:
    text: ".*6 ${output.CURRENT_MONTH_FULL_NAME}.*"
    below:
        text: "Date"

# APPUI BOUTON RETOUR -> RETOUR ÉCRAN DU MOIS
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.monthly" }


- assertVisible:
    text: "Loyer"
    below: "6 ${output.CURRENT_MONTH_NAME}.*"
- runFlow:
    when:
        visible: "1 ${output.CURRENT_MONTH_NAME}.*"
    commands: 
        - assertNotVisible:
            text: "Loyer"
            below: "1 ${output.CURRENT_MONTH_NAME}.*"


# APPUI BOUTON RETOUR -> RETOUR ACCUEIL
- tapOn: { id: "common.btn.back" }


# VÉRIFICATION MOIS PRÉCÉDENT (Isolement)
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.PREV_MONTH_NAME}
      year: ${output.PREV_YEAR}
- assertVisible: { id: "screen.monthly" }
- scrollUntilVisible:
    element: "1 ${output.PREV_MONTH_NAME}.*"
    direction: DOWN
- assertVisible:
    text: "Loyer"
    below: "1 ${output.PREV_MONTH_NAME}.*"

# RETOUR ACCUEIL POUR CHANGEMENT MOIS SUIVANT
- tapOn: { id: "common.btn.back" }
- assertVisible: { id: "screen.home" }

# VÉRIFICATION MOIS SUIVANT (Isolement)
- runFlow:
    file: ../../.maestro/subflows/change_month.yaml
    env:
      month_name: ${output.NEXT_MONTH_NAME}
      year: ${output.NEXT_YEAR}
- assertVisible: { id: "screen.monthly" }
- scrollUntilVisible:
    element: "1 ${output.NEXT_MONTH_NAME}.*"
    direction: DOWN
- assertVisible:
    text: "Loyer"
    below: "1 ${output.NEXT_MONTH_NAME}.*"
