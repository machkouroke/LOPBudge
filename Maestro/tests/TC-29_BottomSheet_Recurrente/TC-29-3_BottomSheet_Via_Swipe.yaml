appId: com.lop.budget
name: "TC-29-3: BottomSheet Via Swipe"
tags:
  - suppression
  - recurrence
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

- evalScript: |
    console.log("Scénario 1 : Vérification via Swipe")

- scrollUntilVisible:
    element: "Loyer"

- assertVisible:
    id: "transaction.item.title"
    text: "Loyer"
- swipe:
    from:
      id: "transaction.item.title"
      text: "Loyer"
    direction: LEFT
    duration: 500

# Vérification présence des 3 options (CA-03)
- extendedWaitUntil:
    visible: "Cette occurrence"
    timeout: 8000
- assertVisible: "Cette occurrence"
- assertVisible: "Les suivantes uniquement"
- assertVisible: "Toute la série"

- tapOn: "Annuler"
- assertVisible: "Loyer"
