appId: com.lop.budget
name: "TC-31: Suppression Transaction Ponctuelle"
tags:
  - suppression
---
- runFlow: ../../.maestro/subflows/bootstrap_monthly.yaml

# Étape 2 : Lancer la suppression
- evalScript: |
    console.log("Lancer la suppression")
- runFlow:
    file: ../../.maestro/subflows/delete_occurrence.yaml
    env:
      text: "Courses Hebdomadaires"

# Étape 3 : Valider le dialogue standard
- evalScript: |
    console.log("Valider le dialogue standard")
- assertVisible: "Supprimer la transaction ?"
- tapOn: "Supprimer"

# Étape 4 : Vérification Robuste de l'état final
- evalScript: |
    console.log("Vérification Robuste de l'état final")
- assertVisible:
    id: "screen.monthly" # On vérifie qu'on est bien revenu sur la vue du mois
- assertNotVisible: "Courses Hebdomadaires" # On cherche dans la vue du mois confirmée
- assertVisible: "Loyer" # La série de contrôle est toujours là dans la même vue
